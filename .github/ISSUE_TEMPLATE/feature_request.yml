name: Feature request / طلب ميزة
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / ما الذي تريد عمله؟
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behaviour / الحل المقترح
  - type: textarea
    id: accounting
    attributes:
      label: Accounting impact / الأثر المحاسبي
      description: Which accounts are debited / credited? Does it change any report?
