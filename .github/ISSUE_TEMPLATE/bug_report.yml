name: Bug report / بلاغ عن خطأ
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real customer data, passwords or `.env` contents.** Use sample data.
        لا تكتب بيانات عملاء حقيقية أو كلمات مرور.
  - type: dropdown
    id: mode
    attributes:
      label: Mode / الوضع
      options: [Offline single file, Server]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / الإصدار
      placeholder: "1.0.0 (or commit hash)"
  - type: input
    id: browser
    attributes:
      label: Browser and device / المتصفح والجهاز
      placeholder: "Chrome 130 on Windows 11"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / خطوات تكرار المشكلة
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual / المتوقع والذي حدث
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / console errors / لقطات شاشة
