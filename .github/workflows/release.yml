name: Release

# Push a tag such as v1.1.0 and this workflow tests the code, builds the two
# deliverables and publishes them on the GitHub Releases page:
# - SIYADA.html          the single-file offline app
# - SIYADA_Server.zip    server + offline file + docs, ready to deploy
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Server
        run: npm run package:server

      - name: Build Desktop App
        run: npm run build:desktop

      - name: Prepare Release Notes
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            fs.writeFileSync('release-notes.md', \`### SIYADA Release \${pkg.version}\n\nAutomated release for version \${pkg.version}.\`);
          "

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # حذف الـ Release والـ Tag القديم إن وجدا لمنع خطأ التعارض وتكرار الإصدار
          gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag || true
          git push origin --delete "refs/tags/${GITHUB_REF_NAME}" || true

          # إنشاء الإصدار الجديد ورفع الملفات المطلوبة
          gh release create "${GITHUB_REF_NAME}" \
            dist/SIYADA.html \
            dist/SIYADA_Server.zip \
            dist/desktop/SIYADA-Setup-*.exe \
            dist/desktop/latest.yml \
            dist/desktop/*.blockmap \
            --title "SIYADA ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
