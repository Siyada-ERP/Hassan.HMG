name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build, engine and server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Node version
        run: node --version

      - name: Build
        run: npm run build

      - name: Engine tie-out (both fixture sets)
        run: npm run test:engine

      - name: Server tests
        run: npm run test:server

      - name: Upload the single-file build
        uses: actions/upload-artifact@v4
        with:
          name: SIYADA.html
          path: dist/SIYADA.html
          if-no-files-found: error

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install Playwright and Chromium
        run: |
          pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run browser suites
        run: python tests/e2e/run_all.py

      - name: Keep screenshots when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: tests/e2e/shots/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build the app into server/public
        run: npm run build

      - name: Build the server image
        run: docker build -t siyada-server:ci server

      - name: Smoke test the container
        run: |
          docker run -d --name siyada -p 3000:3000 -e ADMIN_EMAIL=ci@example.com siyada-server:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/healthz && ok=1 && break
            sleep 1
          done
          docker logs siyada
          test "$ok" = 1
