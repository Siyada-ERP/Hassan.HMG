# تشغيل: docker compose up -d --build
# المطلوب: ملف .env جنب الملف ده فيه DOMAIN و ADMIN_EMAIL (شوف .env.example)
services:
  siyada:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /data
      TRUST_PROXY: "1"
      BASE_URL: https://${DOMAIN}
    volumes:
      - siyada-data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - siyada
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  siyada-data:
  caddy-data:
  caddy-config:
